# R 4.5 / Bioconductor 3.21 toolchain ONLY — deliberately minimal.
#
# The version matters: on R 4.3 / Bioc 3.18 the benchmark silently loses three comparators —
# LOCOM2 (its dependency Deriv now requires R >= 4.5), MaAsLin 3 and ADAPT (both Bioc >= 3.20).
#
# Why so few packages: pulling the bioconductor-* builds through conda made the solve large and
# fragile (conda 2026-09-11 crashed linking bioconductor-genomeinfodbdata with
# "ValueError: unsupported format character"). Conda here provides only R itself, a compiler
# toolchain and the system libraries that are painful to build; every R package comes from
# hpc/install_packages.R via CRAN/Bioconductor, which then resolve against Bioc 3.21.
# r-arrow is the one exception — it is genuinely hard to build from source, and optional
# (results fall back to gzipped CSV without it).
name: pursue-bench
channels: [conda-forge, nodefaults]
dependencies:
  - r-base=4.5
  - c-compiler
  - cxx-compiler
  - fortran-compiler
  - make
  - pkg-config
  - r-remotes
  - r-biocmanager
  - r-arrow
  - curl
  - git
  # system libraries R packages commonly link against
  - libcurl
  - openssl
  - libxml2
  - zlib
  - bzip2
  - xz
  - gsl
  - gmp
  - mpfr
  - libpng
  - freetype
